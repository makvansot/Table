
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 440px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        td {
            border: 1px solid black;
            padding: 18px;
        }

        .top {
            background-color: #eeeeee;
            font-size: 20px;
            font-weight: bold;
        }

        .left {
            background-color: #edcccc;
            font-size: 20px;
            font-weight: bold;
        }

        .empty {
            border: none;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td class="empty"></td>
        <td class="top">&lt;td&gt;</td>
        <td class="top">&lt;td&gt;</td>
        <td class="top">&lt;td&gt;</td>
    </tr>

    <tr>
        <td class="left">&lt;tr&gt;</td>
        <td>Content</td>
        <td>Content</td>
        <td>Content</td>
    </tr>

    <tr>
        <td class="left">&lt;tr&gt;</td>
        <td>Content</td>
        <td>Content</td>
        <td>Content</td>
    </tr>

    <tr>
        <td class="left">&lt;tr&gt;</td>
        <td>Content</td>
        <td>Content</td>
        <td>Content</td>
    </tr>
</table>

</body>
</html>
